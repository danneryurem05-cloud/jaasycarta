<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Jaasiel ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="top">
      <span id="counter">1 / 12</span>
      <div class="progress"><div id="bar"></div></div>
    </div>

    <section id="content" class="page active"></section>

    <div class="controls">
      <button id="prev" class="secondary" disabled>← Atrás</button>
      <button id="next">Siguiente →</button>
    </div>
  </main>

  <div id="finalGlow"></div>
  <script src="script.js"></script>
</body>
</html>
